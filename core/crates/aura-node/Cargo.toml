[package]
name = "aura-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aura-core = { path = "../aura-core" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
